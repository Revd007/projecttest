<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    
    <!-- ELITE SECURITY: CONTENT SECURITY POLICY -->
    <!-- 
       default-src 'self': Hanya boleh load resource dari domain sendiri (localhost:8080)
       connect-src: Hanya boleh connect API ke localhost:5113
       style-src: Boleh inline style (Vue butuh ini)
       script-src: HATI-HATI! Vue butuh 'unsafe-eval' di mode dev. Di production hapus 'unsafe-eval'.
    -->
    <meta http-equiv="Content-Security-Policy" 
      content="default-src 'self'; 
               img-src 'self' data:; 
               connect-src 'self' http://localhost:5113 ws: wss:; 
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
               font-src 'self' https://fonts.gstatic.com;
               script-src 'self' 'unsafe-eval';">
                   
    <title>Projecttest</title>
</head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
